<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter Tight", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .red  { --bg: #c8102e; --bg-deep: #8f0a20; --ink: #fff; --muted: rgba(255,255,255,.82); --tile: #fff; --ring: rgba(255,255,255,.95); }
  .dark { --bg: #0c0d12; --bg-deep: #050507; --ink: #fff; --muted: rgba(255,255,255,.72); --tile: #fff; --ring: rgba(255,255,255,.9); }

  body { background: radial-gradient(120% 120% at 20% 30%, var(--bg) 0%, var(--bg-deep) 100%); }

  /* Mosaik-væg i perspektiv */
  .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 70% 50%; }
  .wall {
    position: absolute; left: 470px; top: -250px;
    display: grid; grid-template-columns: repeat(11, 92px); gap: 16px;
    transform: rotateY(-24deg) rotateX(14deg) rotateZ(-10deg);
    transform-origin: 0 50%;
  }
  .tile { width: 92px; height: 92px; display: grid; place-items: center; overflow: hidden; }
  .tile.logo { background: var(--tile); border-radius: 22px; padding: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.22); }
  .tile.logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
  .tile.face { border-radius: 50%; border: 4px solid var(--ring); box-shadow: 0 10px 24px rgba(0,0,0,.25); background: #ddd; }
  .tile.face img { width: 100%; height: 100%; object-fit: cover; }

  /* Fade så teksten står skarpt */
  .fade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, var(--bg) 0%, var(--bg) 36%, color-mix(in srgb, var(--bg) 80%, transparent) 50%, transparent 72%),
      linear-gradient(0deg, color-mix(in srgb, var(--bg-deep) 55%, transparent) 0%, transparent 30%);
  }

  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; color: var(--ink); }

  .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 22px; letter-spacing: .02em; color: var(--muted); }
  .brand-mark { width: 34px; height: 34px; flex: none; }

  h1 { margin-top: 22px; font-weight: 900; font-size: 100px; line-height: .92; letter-spacing: -.045em; }
  .lead { margin-top: 28px; font-weight: 500; font-size: 30px; line-height: 1.25; color: var(--muted); letter-spacing: -.01em; max-width: 540px; }
  .lead b { color: var(--ink); font-weight: 800; }

  .proof { margin-top: 40px; display: flex; align-items: center; gap: 18px; }
  .stack { display: flex; }
  .stack img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); margin-left: -14px; }
  .stack img:first-child { margin-left: 0; }
  .proof p { font-size: 20px; line-height: 1.3; font-weight: 500; color: var(--muted); }
  .proof p b { color: var(--ink); font-weight: 800; }
</style>
</head>
<body class="{{THEME}}">
  <div class="stage"><div class="wall">
{{TILES}}
  </div></div>
  <div class="fade"></div>

  <div class="copy">
    <div class="eyebrow"><svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">  <polygon points="16,1.3 31.4,9.6 16,17.9 0.6,9.6" fill="#ffffff"/>  <polyline points="1.9,16 16,23.7 30.1,16" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>  <polyline points="1.9,22.4 16,30.1 30.1,22.4" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>dansktechstack.dk</div>
    <h1>Den danske<br>tech stack</h1>
    <p class="lead"><b>{{PRODUCTS}} danske alternativer</b> til Stripe, Shopify, Mailchimp, Zendesk&nbsp;&amp;&nbsp;co.</p>
    <div class="proof">
      <div class="stack">
{{STACK}}
      </div>
      <p>Anbefalet af <b>{{BACKERS}} iværksættere</b><br>og <b>{{CONTRIBUTORS}} bidragydere</b> på GitHub</p>
    </div>
  </div>
</body>
</html>
