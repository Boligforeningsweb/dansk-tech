name: Alternativsider

on:
  pull_request:
    paths:
      - 'products.json'
      - 'readme.md'
      - 'index.php'
      - '*.webmanifest'
      - 'og-image*.jpg'
      - 'data/product-guides.json'
      - 'data/translations/**'
      - 'lib/**.php'
      - 'pages/**.php'
      - 'partials/**.php'
      - 'tools/check-alternative-pages.php'
      - 'tools/check-localization.php'
      - 'tools/check-language-preferences.php'
      - 'tools/check-contribution-links.php'
      - '.github/workflows/alternatives.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php tools/check-alternative-pages.php
      - run: php tools/check-localization.php
      - run: php tools/check-language-preferences.php
      - run: php tools/check-contribution-links.php
